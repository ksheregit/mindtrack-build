# nginx settings for the MindTrack app
server {
  # Listen on port 3000 (the assignment requires the app on port 3000)
  # There’s an alternative: leave nginx on port 80 and have the Kubernetes service expose 3000 and forward to 80. 
  # That would work, but listening on 3000 inside the container matches the assignment wording most directly.
  # and it keeps the Dockerfile, local test and Kubernetes files all on the same port.
  listen 3000;
  server_name _;

  # Folder where the built React files are copied inside the image
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}

#Small benefit is the try_files ... 
#It makes any URL path fall back to index.html, which single-page apps like this one need if they use client-side routes.